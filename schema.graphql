# ============================================================
# Aave V4 Omnigraph — schema
#
# Indexes what AaveKit (api.aave.com/graphql) doesn't expose:
#   1. Hub<->Spoke liquidity routing (Add/Remove/Draw/Restore/
#      RefreshPremium/ReportDeficit/TransferShares)
#   2. Per-user risk-premium trajectory + dynamic config drift
#   3. Liquidation post-mortems with full on-chain context
#   4. Spoke + reserve config governance trail
#   5. Treasury / fee-share / deficit accounting
#
# Best practices applied:
#   - Bytes for IDs (perf)
#   - @derivedFrom for reverse relations (no big arrays)
#   - @entity(immutable: true) for append-only event records
#   - Pruning hint in manifest
# ============================================================

# ── Hubs ────────────────────────────────────────────────────
type Hub @entity(immutable: false) {
  id: Bytes! # address
  name: String! # "Core" | "Plus" | "Prime"
  chainId: Int!
  createdAtBlock: BigInt!
  createdAtTx: Bytes!
  assets: [HubAsset!]! @derivedFrom(field: "hub")
}

type HubAsset @entity(immutable: false) {
  id: Bytes! # hubAddress . assetId-bytes
  hub: Hub!
  assetId: BigInt!
  underlying: Bytes! # ERC20 address
  decimals: Int!
  feeReceiver: Bytes
  liquidityFee: Int
  irStrategy: Bytes
  reinvestmentController: Bytes
  drawnIndex: BigInt
  drawnRate: BigInt
  accruedFees: BigInt
  lastUpdatedBlock: BigInt
  spokeConfigs: [HubSpokeConfig!]! @derivedFrom(field: "hubAsset")
  flows: [HubSpokeFlow!]! @derivedFrom(field: "hubAsset")
  # v0.2.0
  symbol: String
  lastPriceUSD: BigDecimal
  totalFeesMinted: BigInt
  totalFeesMintedUSD: BigDecimal
  totalDeficitRay: BigInt
  drawnRateAPR: BigDecimal
}

type HubSpokeConfig @entity(immutable: false) {
  id: Bytes! # hubAddress . assetId-bytes . spokeAddress
  hub: Hub!
  hubAsset: HubAsset!
  spoke: Spoke!
  addCap: BigInt!
  drawCap: BigInt!
  riskPremiumThreshold: Int!
  active: Boolean!
  halted: Boolean!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
  history: [HubSpokeConfigSnapshot!]! @derivedFrom(field: "config")
}

type HubSpokeConfigSnapshot @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  config: HubSpokeConfig!
  addCap: BigInt!
  drawCap: BigInt!
  riskPremiumThreshold: Int!
  active: Boolean!
  halted: Boolean!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
}

# ── Spokes ──────────────────────────────────────────────────
type Spoke @entity(immutable: false) {
  id: Bytes! # address
  hub: Hub
  oracle: Bytes
  maxUserReservesLimit: Int
  liquidationConfig: SpokeLiquidationConfig
  createdAtBlock: BigInt!
  createdAtTx: Bytes!
  reserves: [Reserve!]! @derivedFrom(field: "spoke")
  positionManagerWhitelist: [SpokePositionManagerWhitelist!]! @derivedFrom(field: "spoke")
  # v0.2.0 (USD at oracle price, refreshed on each spoke event)
  totalSuppliedUSD: BigDecimal
  totalDebtUSD: BigDecimal
  userCount: Int
  borrowerCount: Int
  liquidationCount: Int
  totalLiquidatedDebtUSD: BigDecimal
  daily: [SpokeDaily!]! @derivedFrom(field: "spoke")
}

type SpokeLiquidationConfig @entity(immutable: false) {
  id: Bytes! # spokeAddress
  spoke: Spoke!
  targetHealthFactor: BigInt!
  healthFactorForMaxBonus: BigInt!
  liquidationBonusFactor: Int!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
  history: [SpokeLiquidationConfigSnapshot!]! @derivedFrom(field: "config")
}

type SpokeLiquidationConfigSnapshot @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  config: SpokeLiquidationConfig!
  targetHealthFactor: BigInt!
  healthFactorForMaxBonus: BigInt!
  liquidationBonusFactor: Int!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
}

# ── Reserves ────────────────────────────────────────────────
type Reserve @entity(immutable: false) {
  id: Bytes! # spokeAddress . reserveId-bytes
  spoke: Spoke!
  reserveId: BigInt!
  assetId: BigInt!
  hub: Hub!
  priceSource: Bytes
  collateralRisk: Int
  paused: Boolean
  frozen: Boolean
  borrowable: Boolean
  receiveSharesEnabled: Boolean
  latestDynamicConfigKey: BigInt
  dynamicConfigHistory: [DynamicReserveConfig!]! @derivedFrom(field: "reserve")
  reserveConfigHistory: [ReserveConfigSnapshot!]! @derivedFrom(field: "reserve")
  priceSourceHistory: [ReservePriceSourceSnapshot!]! @derivedFrom(field: "reserve")
  # v0.2.0
  underlying: Bytes
  symbol: String
  name: String
  decimals: Int
  lastPriceUSD: BigDecimal
  lastPriceRaw: BigInt
  lastPriceTimestamp: BigInt
  totalSupplied: BigInt
  totalDebt: BigInt
  totalSuppliedUSD: BigDecimal
  totalDebtUSD: BigDecimal
  utilization: BigDecimal
  collateralFactor: Int
  maxLiquidationBonus: BigInt
  liquidationFee: Int
  supplierCount: Int
  borrowerCount: Int
  cumulativeSuppliedUSD: BigDecimal
  cumulativeBorrowedUSD: BigDecimal
  cumulativeLiquidatedUSD: BigDecimal
  daily: [ReserveDaily!]! @derivedFrom(field: "reserve")
  positions: [UserReservePosition!]! @derivedFrom(field: "reserve")
}

type ReserveConfigSnapshot @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  reserve: Reserve!
  collateralRisk: Int!
  paused: Boolean!
  frozen: Boolean!
  borrowable: Boolean!
  receiveSharesEnabled: Boolean!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type ReservePriceSourceSnapshot @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  reserve: Reserve!
  priceSource: Bytes!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type DynamicReserveConfig @entity(immutable: true) {
  id: Bytes! # spokeAddress . reserveId-bytes . key-bytes
  reserve: Reserve!
  key: BigInt!
  collateralFactor: Int!
  maxLiquidationBonus: BigInt!
  liquidationFee: Int!
  createdAtBlock: BigInt!
  createdAtTx: Bytes!
}

# ── Hub<->Spoke Flow events (the headline data) ─────────────
enum HubSpokeFlowType {
  ADD
  REMOVE
  DRAW
  RESTORE
  REFRESH_PREMIUM
  REPORT_DEFICIT
  TRANSFER_SHARES
}

type HubSpokeFlow @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  type: HubSpokeFlowType!
  hub: Hub!
  hubAsset: HubAsset!
  spoke: Spoke
  counterpartySpoke: Spoke # for TRANSFER_SHARES receiver
  shares: BigInt
  amount: BigInt
  drawnShares: BigInt
  drawnAmount: BigInt
  premiumAmount: BigInt
  deficitAmountRay: BigInt
  premiumSharesDelta: BigInt
  premiumOffsetRayDelta: BigInt
  restoredPremiumRay: BigInt
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
  amountUSD: BigDecimal
}

type HubAssetDaily @entity(immutable: false) {
  id: Bytes! # hubAssetId . day-bytes
  hubAsset: HubAsset!
  day: Int!
  date: BigInt!
  totalAddedAmount: BigInt!
  totalRemovedAmount: BigInt!
  totalDrawnAmount: BigInt!
  totalRestoredAmount: BigInt!
  totalDeficitRay: BigInt!
  flowCount: Int!
  # v0.2.0 (rates/index close for the day, USD volumes at latest observed price)
  drawnRate: BigInt
  drawnRateAPR: BigDecimal
  drawnIndex: BigInt
  accruedFees: BigInt
  feesMinted: BigInt
  feesMintedUSD: BigDecimal
  addedUSD: BigDecimal
  removedUSD: BigDecimal
  drawnUSD: BigDecimal
  restoredUSD: BigDecimal
}

# ── Users + risk premium trajectory ─────────────────────────
type User @entity(immutable: false) {
  id: Bytes! # address
  latestRiskPremium: BigInt!
  latestRiskPremiumSpoke: Spoke
  riskPremiumHistory: [UserRiskPremiumSnapshot!]! @derivedFrom(field: "user")
  positionManagers: [UserPositionManager!]! @derivedFrom(field: "user")
  liquidationsAsUser: [LiquidationCall!]! @derivedFrom(field: "user")
  premiumDebtRefreshes: [PremiumDebtRefresh!]! @derivedFrom(field: "user")
  # v0.2.0 account snapshot from Spoke.getUserAccountData at the user's last event
  healthFactor: BigDecimal
  totalCollateralUSD: BigDecimal
  totalDebtUSD: BigDecimal
  avgCollateralFactor: BigDecimal
  activeCollateralCount: Int
  borrowCount: Int
  accountUpdatedAt: BigInt
  firstSeenTimestamp: BigInt
  firstBorrowTimestamp: BigInt
  secondsToFirstBorrow: BigInt
  activityCount: Int
  liquidationCount: Int
  positions: [UserReservePosition!]! @derivedFrom(field: "user")
  activities: [UserActivity!]! @derivedFrom(field: "user")
}

type UserRiskPremiumSnapshot @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  user: User!
  spoke: Spoke!
  riskPremium: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type UserPositionManager @entity(immutable: false) {
  id: Bytes! # userAddress . spokeAddress . positionManagerAddress
  user: User!
  spoke: Spoke!
  positionManager: Bytes!
  approved: Boolean!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
}

type PremiumDebtRefresh @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  spoke: Spoke!
  reserve: Reserve!
  user: User!
  premiumSharesDelta: BigInt!
  premiumOffsetRayDelta: BigInt!
  restoredPremiumRay: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# ── User-side spoke activity ────────────────────────────────
enum UserActivityType {
  SUPPLY
  WITHDRAW
  BORROW
  REPAY
  SET_COLLATERAL
  REFRESH_DYNAMIC_CONFIG
}

type UserActivity @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  type: UserActivityType!
  spoke: Spoke!
  reserve: Reserve!
  user: User!
  caller: Bytes
  shares: BigInt
  amount: BigInt
  totalAmountRepaid: BigInt
  usingAsCollateral: Boolean
  premiumSharesDelta: BigInt
  premiumOffsetRayDelta: BigInt
  restoredPremiumRay: BigInt
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
  # v0.2.0
  priceUSD: BigDecimal
  amountUSD: BigDecimal
  hourOfWeekUTC: Int
  dayOfWeekUTC: Int
  usMarketHours: Boolean
}

# ── Liquidations (highest-value data) ───────────────────────
type LiquidationCall @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  spoke: Spoke!
  collateralReserve: Reserve!
  debtReserve: Reserve!
  user: User!
  liquidator: Bytes!
  receiveShares: Boolean!
  debtAmountRestored: BigInt!
  drawnSharesLiquidated: BigInt!
  collateralAmountRemoved: BigInt!
  collateralSharesLiquidated: BigInt!
  collateralSharesToLiquidator: BigInt!
  premiumSharesDelta: BigInt!
  premiumOffsetRayDelta: BigInt!
  restoredPremiumRay: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  logIndex: BigInt!
  # v0.2.0
  collateralPriceUSD: BigDecimal
  debtPriceUSD: BigDecimal
  collateralRemovedUSD: BigDecimal
  debtRestoredUSD: BigDecimal
  liquidatorProfitUSD: BigDecimal
  healthFactorAfter: BigDecimal
  hourOfWeekUTC: Int
  usMarketHours: Boolean
}

# ── Treasury / fees / deficits ──────────────────────────────
type FeeMint @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  hub: Hub!
  hubAsset: HubAsset!
  feeReceiver: Bytes!
  shares: BigInt!
  assets: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  assetsUSD: BigDecimal
}

type Sweep @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  hub: Hub!
  hubAsset: HubAsset!
  reinvestmentController: Bytes!
  amount: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type Reclaim @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  hub: Hub!
  hubAsset: HubAsset!
  reinvestmentController: Bytes!
  amount: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type DeficitEliminated @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  hub: Hub!
  hubAsset: HubAsset!
  callerSpoke: Spoke!
  coveredSpoke: Spoke!
  shares: BigInt!
  deficitAmountRay: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type SpokeReportedDeficit @entity(immutable: true) {
  id: Bytes! # txHash . logIndex
  spoke: Spoke!
  reserve: Reserve!
  user: User!
  drawnShares: BigInt!
  premiumSharesDelta: BigInt!
  premiumOffsetRayDelta: BigInt!
  restoredPremiumRay: BigInt!
  block: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# ── Position manager registry at spoke level ────────────────
type SpokePositionManagerWhitelist @entity(immutable: false) {
  id: Bytes! # spokeAddress . positionManagerAddress
  spoke: Spoke!
  positionManager: Bytes!
  active: Boolean!
  updatedAtBlock: BigInt!
  updatedAtTx: Bytes!
}

# ── v0.2.0: positions, daily rollups, cohorts ───────────────
type UserReservePosition @entity(immutable: false) {
  id: Bytes! # user . spoke . reserveId
  user: User!
  spoke: Spoke!
  reserve: Reserve!
  supplied: BigInt!
  debt: BigInt!
  suppliedUSD: BigDecimal!
  debtUSD: BigDecimal!
  usingAsCollateral: Boolean!
  "Oracle price at which this collateral makes HF=1, valid only when it is the user's single collateral"
  liquidationPriceUSD: BigDecimal
  updatedAt: BigInt!
  updatedAtBlock: BigInt!
}

type ReserveDaily @entity(immutable: false) {
  id: Bytes! # reserveId . day
  reserve: Reserve!
  day: Int!
  date: BigInt!
  openPriceUSD: BigDecimal
  highPriceUSD: BigDecimal
  lowPriceUSD: BigDecimal
  closePriceUSD: BigDecimal
  totalSuppliedUSD: BigDecimal!
  totalDebtUSD: BigDecimal!
  utilization: BigDecimal!
  suppliedUSD: BigDecimal!
  withdrawnUSD: BigDecimal!
  borrowedUSD: BigDecimal!
  repaidUSD: BigDecimal!
  liquidatedUSD: BigDecimal!
  activityCount: Int!
  uniqueUsers: Int!
}

type ReserveDailyUser @entity(immutable: true) {
  id: Bytes! # reserveDaily . user
}

type SpokeDaily @entity(immutable: false) {
  id: Bytes! # spoke . day
  spoke: Spoke!
  day: Int!
  date: BigInt!
  totalSuppliedUSD: BigDecimal!
  totalDebtUSD: BigDecimal!
  volumeUSD: BigDecimal!
  activityCount: Int!
  liquidationCount: Int!
  uniqueUsers: Int!
  newUsers: Int!
  newBorrowers: Int!
}

type SpokeDailyUser @entity(immutable: true) {
  id: Bytes! # spokeDaily . user
}
